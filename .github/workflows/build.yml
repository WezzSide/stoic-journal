name: Build and Verify Debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build debug instrumentation tests
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"
            exit 1
          fi
          ls -lh "$APK"
          echo "=== aapt dump badging ==="
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK"
          echo "=== apksigner verify ==="
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            */build/reports
          if-no-files-found: ignore
          retention-days: 7
